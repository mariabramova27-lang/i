  /* ===== ПЕЧАТЬ ===== */
  @media print {

/* ============================================================
   ПРОГРЕСС
   ============================================================ */

function updateProgress() {
  let total, current;
  if (state.phase === "closed") {
    total = QUESTIONS.length + OPEN_QUESTIONS.length;
    current = state.currentQuestion;
  } else if (state.phase === "open") {
    total = QUESTIONS.length + OPEN_QUESTIONS.length;
    current = QUESTIONS.length + state.currentOpen;
  } else {
    progressFill.style.width = '100%';
    progressPercent.textContent = '100%';
    stageLabel.textContent = 'Готово!';
    return;
  }
  const percent = Math.round((current / total) * 100);
  progressFill.style.width = percent + '%';
  progressPercent.textContent = percent + '%';

  let stageName;
  if (state.phase === "closed") {
    const stageIdx = QUESTIONS[state.currentQuestion].stage;
    stageName = STAGES[stageIdx].emoji + ' ' + STAGES[stageIdx].name;
  } else {
    stageName = STAGES[4].emoji + ' ' + STAGES[4].name;
  }
  stageLabel.textContent = stageName;
}

/* ============================================================
   ВОПРОСЫ
   ============================================================ */

function renderClosedQuestion() {
  state.phase = "closed";
  const q = QUESTIONS[state.currentQuestion];
  updateProgress();

  let html = `<div class="stage-badge">${STAGES[q.stage].emoji} ${STAGES[q.stage].name}</div>`;
  html += `<div class="question">${q.text}</div>`;
  html += `<div id="answersBlock">`;
  q.answers.forEach((ans, i) => {
    html += `<button class="answer" data-index="${i}">${ans.text}</button>`;
  });
  html += `</div>`;
  app.innerHTML = html;

  document.querySelectorAll('.answer').forEach(btn => {
    btn.addEventListener('click', () => handleClosedAnswer(parseInt(btn.dataset.index)));
  });
}

function handleClosedAnswer(index) {
  const q = QUESTIONS[state.currentQuestion];
  const ans = q.answers[index];
  state.scales[ans.primary] += 2;
  state.scales[ans.secondary] += 1;
  state.answers.push(index);

  document.querySelectorAll('.answer').forEach((btn, i) => {
    if (i === index) btn.classList.add('selected');
    btn.disabled = true;
  });

  setTimeout(() => {
    state.currentQuestion++;
    if (state.currentQuestion < QUESTIONS.length) {
      renderClosedQuestion();
    } else {
      state.phase = "open";
      state.currentOpen = 0;
      renderOpenQuestion();
    }
  }, 280);
}

function renderOpenQuestion() {
  state.phase = "open";
  const oq = OPEN_QUESTIONS[state.currentOpen];
  updateProgress();

  app.innerHTML = `
    <div class="stage-badge">${STAGES[4].emoji} ${STAGES[4].name}</div>
    <div class="question">${oq.text}</div>
    <div class="open-hint">Здесь нет правильных ответов. Напиши то, что первое приходит в голову.</div>
    <textarea class="open-input" id="openInput" placeholder="${oq.placeholder}"></textarea>
    <button class="btn btn-primary" id="nextOpenBtn">
      ${state.currentOpen < OPEN_QUESTIONS.length - 1 ? 'Дальше →' : 'Собрать портрет ✨'}
    </button>
    ${state.currentOpen > 0 ? '<button class="btn btn-secondary" id="backOpenBtn">← Назад</button>' : ''}
  `;

  const input = document.getElementById('openInput');
  input.value = state.openAnswers[state.currentOpen] || '';
  input.focus();

  document.getElementById('nextOpenBtn').addEventListener('click', () => {
    state.openAnswers[state.currentOpen] = input.value.trim();
    state.currentOpen++;
    if (state.currentOpen < OPEN_QUESTIONS.length) {
      renderOpenQuestion();
    } else {
      state.phase = "result";
      renderResult();
    }
  });

  const backBtn = document.getElementById('backOpenBtn');
  if (backBtn) {
    backBtn.addEventListener('click', () => {
      state.openAnswers[state.currentOpen] = input.value.trim();
      state.currentOpen--;
      renderOpenQuestion();
    });
  }
}

  let chartHtml = '<div class="chart">';
  Object.entries(state.scales).forEach(([key, val]) => {

      <div class="chart-row">
        <div class="chart-label">${t.emoji} ${t.name}</div>
        <div class="chart-bar">
          <div class="chart-fill" style="width:0%;background:${t.color};" data-width="${width}"></div>
        </div>
        <div class="chart-score">${val}</div>
      </div>
    `;
  });
  chartHtml += '</div>';

  let thoughtsHtml = '';
  if (state.openAnswers.some(a => a && a.length > 0)) {
    thoughtsHtml = '<div class="type-block" style="border-left-color:#f6a02e;background:#fff9f0;">';

      const ans = state.openAnswers[i];
      if (ans && ans.length > 0) {
        thoughtsHtml += `<p><strong>${oq.text}</strong><br>${escapeHtml(ans)}</p>`;
      }
    });
    thoughtsHtml += '</div></div>';
  }

  const promoHtml = `

      <div class="promo-result-title">🎓 Хочешь узнать больше о своих сильных сторонах?</div>

        В «Мягкой математике» мы помогаем не только с подготовкой к ОГЭ/ЕГЭ по математике, но и с выбором пути.
        Подписывайся на группу и задай вопрос Марии Абрамовой — она поможет разобраться.
      </div>

        <a class="promo-link" href="https://vk.com/smartskillsmaria" target="_blank" rel="noopener">
          📚 Подписаться на группу
        </a>
        <a class="promo-link" href="https://vk.com/im/convo/-229273902?entrypoint=community_page&tab=all" target="_blank" rel="noopener">

    <div class="result-title">Твой портрет путешественника</div>

    <div class="type-block" style="border-left-color:${main.color};background:${main.bg};">

  document.getElementById('printBtn').addEventListener('click', () => window.print());

}

function getLevel(score) {
  if (score >= 35) return 'Ярко выражено';
  if (score >= 20) return 'Заметно';
  if (score >= 10) return 'Слабо выражено';
  return 'Почти не проявляется';
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
